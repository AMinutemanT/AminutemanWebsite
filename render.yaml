# Render blueprint for the static site.
#
# The live service predates this file. If it was created from the dashboard,
# Render will not adopt these settings automatically: either attach the service
# to this blueprint, or mirror the headers and routes below in the dashboard
# under Settings > Headers and Settings > Redirects/Rewrites.
#
# The site is a single page (index.html) with three hash routes:
# /#home, /#products, /#contact. The old multi-route URLs redirect to the
# matching hash so inbound links and search results keep working.

services:
  - type: web
    name: aminuteman-website
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      # Scripts and styles are our own and inline. The third parties the page
      # talks to are the Web3Forms endpoint (enquiry form) and PostHog
      # (analytics, US cloud). frame-ancestors is what stops clickjacking.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://us-assets.i.posthog.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:;
          font-src 'self';
          media-src 'self';
          connect-src 'self' https://api.web3forms.com https://us.i.posthog.com https://us-assets.i.posthog.com;
          worker-src 'self' blob:;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self' https://api.web3forms.com;
          object-src 'none';
          upgrade-insecure-requests
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /videos/*
        name: Cache-Control
        value: public, max-age=604800

    routes:
      # Old multi-page routes → the matching hash page.
      - type: redirect
        source: /systems/*
        destination: /#products
      - type: redirect
        source: /systems
        destination: /#products
      - type: redirect
        source: /ai/*
        destination: /#products
      - type: redirect
        source: /ai
        destination: /#products
      - type: redirect
        source: /valley/*
        destination: /#products
      - type: redirect
        source: /valley
        destination: /#products
      - type: redirect
        source: /products/*
        destination: /#products
      - type: redirect
        source: /products
        destination: /#products
      - type: redirect
        source: /technologies/*
        destination: /#products
      - type: redirect
        source: /technologies
        destination: /#products
      - type: redirect
        source: /air-systems/*
        destination: /#products
      - type: redirect
        source: /kamikaze
        destination: /#products
      - type: redirect
        source: /wingmans
        destination: /#products
      - type: redirect
        source: /contact
        destination: /#contact
      - type: redirect
        source: /about
        destination: /#home
      - type: redirect
        source: /careers
        destination: /#contact
      # Everything else serves the single page.
      - type: rewrite
        source: /*
        destination: /index.html
